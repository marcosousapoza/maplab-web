name: Release Check

on:
  push:
    tags: ["v*"]

jobs:
  version:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Validate tag
        run: test "$GITHUB_REF_NAME" = "v$(node --print "require('./package.json').version")"
